<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<meta name="robots" content="noindex, nofollow">
<title>股票助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="lock" class="lock">
  <form id="lock-form" autocomplete="on">
    <div class="eyebrow">个人持仓 · 加密数据</div>
    <h1>股票助手</h1>
    <label for="pass">输入密码解锁</label>
    <div style="display:flex;gap:8px"><input id="pass" name="password" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required style="flex:1;min-width:0"><button type="button" id="toggle-pass" class="topbtn" style="min-width:56px;border:1px solid var(--line);border-radius:12px;color:var(--ink)">隐藏</button></div>
    <label class="remember"><input id="remember" type="checkbox" checked> 在这台设备上记住</label>
    <button class="go" type="submit">解锁</button>
    <p class="err" id="lock-err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="app">
    <header class="top">
      <div><div class="eyebrow" id="asof"></div><h1 id="title">今日</h1></div>
      <div class="src">数据来源 Robinhood<br><button class="topbtn" id="lock-btn" type="button">锁定</button></div>
    </header>
    <main id="view" class="stack" aria-live="polite"></main>
  </div>

  <nav class="tabs" aria-label="页面">
    <div class="in">
      <button class="tab" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>今日</button>
      <button class="tab" data-tab="market"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>市场</button>
      <button class="tab" data-tab="watch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>观察</button>
      <button class="tab" data-tab="radar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>捡漏</button>
      <button class="tab" data-tab="earnings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>财报</button>
    </div>
  </nav>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<script src="app.js"></script>
</body>
</html>
